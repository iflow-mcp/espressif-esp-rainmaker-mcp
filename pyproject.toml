[project]
name = "iflow-mcp_espressif-esp-rainmaker-mcp"
version = "0.2.1"
description = "MCP wrapper for ESP-Rainmaker CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "esp-rainmaker-cli>=1.5.3,<2.0.0",
    "mcp[cli]>=1.6.0,<2.0.0",
]

[project.scripts]
esprainmaker-mcp = "__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "server.py",
    "__main__.py",
    "README.md",
    "LICENSE"
]